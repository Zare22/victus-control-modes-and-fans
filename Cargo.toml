[package]
name = "victus-control"
version = "0.1.0"
edition = "2024"
description = "Tiny Windows tray app for HP Victus performance mode and max fan"
license = "MIT"
publish = false

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
